<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Submit references — Solura Home Care</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#3A7DC9;--sky-pale:#EBF3FB;--sky-deep:#1E4E8C;--navy:#1A3F72;--gold:#C8870A;--gold-deep:#8B6500;
  --grn:#3D7A34;--warm:#FAFAF8;--ink:#1c2433;--mid:#4a5568;--soft:#9CA3AF;--softer:#D1D5DB;--line:#E7E2D8;
  --red:#B03025;
  --r:12px;--r-lg:18px;--sh:0 6px 22px rgba(20,40,80,.09),0 2px 6px rgba(0,0,0,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--warm);color:var(--ink);line-height:1.5;
  background-image:radial-gradient(circle at 50% -10%,var(--sky-pale),transparent 46%)}
.wrap{max-width:540px;margin:0 auto;padding:24px 18px 60px}
.head{text-align:center;margin-bottom:8px}
.brand{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:30px;color:var(--navy)}
.brand small{display:block;font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;font-size:11.5px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--gold-deep);margin-top:4px}
.lede{text-align:center;color:var(--mid);font-size:14.5px;margin:10px auto 18px;max-width:440px;line-height:1.55}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh);padding:18px;margin-bottom:14px;position:relative;animation:fadeUp .25s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card h2{font-family:'Cormorant Garamond',serif;font-size:20px;color:var(--navy);font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h2 .num{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--sky-pale);color:var(--sky-deep);font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:700}
.card .opt-tag{font-size:10.5px;font-weight:600;color:var(--soft);background:var(--warm);padding:3px 8px;border-radius:6px;margin-left:auto}
.card .req-tag{font-size:10.5px;font-weight:700;color:#fff;background:var(--gold);padding:3px 8px;border-radius:6px;margin-left:auto}
.card .remove-btn{position:absolute;top:14px;right:14px;font-family:inherit;background:none;border:none;color:var(--soft);font-size:18px;cursor:pointer;padding:4px 8px;border-radius:6px;line-height:1}
.card .remove-btn:hover{background:var(--red);color:#fff}
.q{margin-bottom:14px}
.q>label{display:block;font-size:13.5px;font-weight:600;color:var(--ink);margin-bottom:6px}
.q .req{color:var(--gold)}
.q .hint{display:block;font-size:11.5px;color:var(--soft);margin-top:3px;font-weight:400}
input[type=text],input[type=tel],input[type=email],select,textarea{width:100%;font-family:inherit;font-size:16px;color:var(--ink);
  background:var(--warm);border:1px solid var(--softer);border-radius:9px;padding:11px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--sky);box-shadow:0 0 0 3px var(--sky-pale)}
textarea{min-height:62px;resize:vertical;font-family:inherit}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.add-more{width:100%;font-family:inherit;font-size:14px;font-weight:600;color:var(--sky-deep);background:#fff;border:1.5px dashed var(--sky-mid,#9DC4E8);border-radius:12px;padding:14px;cursor:pointer;transition:.15s;margin-bottom:14px}
.add-more:hover{background:var(--sky-pale);border-color:var(--sky)}
.add-more:disabled{opacity:.4;cursor:not-allowed}
.submit{width:100%;font-family:inherit;font-weight:700;font-size:16px;color:#fff;background:var(--navy);border:none;
  border-radius:12px;padding:15px;cursor:pointer;box-shadow:var(--sh);transition:.15s;margin-top:8px}
.submit:hover{background:var(--sky-deep)}
.submit:active{transform:scale(.98)}
.submit:disabled{opacity:.55;cursor:not-allowed;transform:none}
.foot{text-align:center;color:var(--soft);font-size:12px;margin-top:14px;line-height:1.5}
.done{text-align:center;padding:48px 20px}
.done .ck{width:66px;height:66px;border-radius:50%;background:var(--grn);color:#fff;display:grid;place-items:center;font-size:34px;margin:0 auto 18px;box-shadow:0 8px 24px rgba(61,122,52,.3)}
.done h2{font-family:'Cormorant Garamond',serif;font-size:27px;color:var(--navy);margin-bottom:8px}
.done p{color:var(--mid);font-size:15px;max-width:380px;margin:0 auto 10px}
.err{text-align:center;padding:32px 20px}
.err h2{font-family:'Cormorant Garamond',serif;font-size:24px;color:var(--red);margin-bottom:10px}
.err p{color:var(--mid);font-size:14px;max-width:380px;margin:0 auto 10px}
.banner{background:#FFF8E7;border:1px solid #E8B84B;color:var(--gold-deep);padding:10px 14px;border-radius:10px;font-size:12.5px;margin-bottom:14px}
@media (max-width:480px){
  .wrap{padding:18px 12px 50px}
  .card{padding:14px}
  .brand{font-size:26px}
  .grid2{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="head"><div class="brand">Solura Home Care<small>References Form</small></div></div>
  <p class="lede">Thanks for getting on the call. Please share <b>2 to 3 professional references</b> — ideally people who supervised you. We do the calling.</p>

  <div id="refs-container"></div>

  <button class="add-more" id="add-btn" onclick="addRef()">+ Add another reference</button>

  <button class="submit" onclick="submitRefs()" id="submit-btn">Submit references</button>
  <p class="foot">Solura Home Care · Cleveland Heights, OH<br>Questions? <a href="mailto:careers@solurahomecare.com" style="color:var(--sky-deep);font-weight:600">careers@solurahomecare.com</a></p>
</div>

<script>
// Cloudflare Worker URL — owner's deployed worker. If this changes, edit here AND in Solura_Application_Form.html.
const WEBHOOK_URL='https://solura-hiring-webhook.meir-865.workers.dev';

const RELATIONSHIPS=[
  ['Former supervisor / manager','supervisor'],
  ['Coworker (caregiver)','coworker'],
  ['Family of a former patient','patientFamily'],
  ['Case manager / RN / agency','case_manager'],
  ['Personal reference','personal'],
  ['Other','other']
];
const DURATIONS=[
  ['Under 6 months','u6'],
  ['6–12 months','y1'],
  ['1–2 years','y2'],
  ['2–5 years','y5'],
  ['5+ years','y5p']
];

const refs=[{}, {}]; /* start with 2 empty slots */
const MAX_REFS=5;

/* Read candidate identifiers from URL params. We accept BOTH `ref` (the candidate's refCode,
   primary identifier — stable, unique, doesn't change with email edits) and `email` (fallback
   for older candidates without a refCode). Either is sufficient for the worker to look up the
   candidate. Submitting both makes the matching more robust. */
function getCandidateIdentifiers(){
  const params=new URLSearchParams(window.location.search);
  return {
    refCode:(params.get('ref')||'').trim(),
    email:(params.get('email')||'').toLowerCase().trim()
  };
}
function getCandidateEmail(){
  /* Kept for backwards compatibility but unused in the new validate flow. */
  return getCandidateIdentifiers().email;
}

function renderRefs(){
  const c=document.getElementById('refs-container');
  c.innerHTML=refs.map((r,i)=>{
    const required=i<2;
    const removable=refs.length>2;
    return `<div class="card">
      <h2><span class="num">${i+1}</span>Reference ${i+1}${required?'<span class="req-tag">REQUIRED</span>':'<span class="opt-tag">Optional</span>'}
        ${removable?'<button class="remove-btn" onclick="removeRef('+i+')" title="Remove">×</button>':''}
      </h2>
      <div class="grid2">
        <div class="q"><label>First name <span class="req">*</span></label>
          <input type="text" value="${esc(r.firstName||'')}" oninput="setRef(${i},'firstName',this.value)" autocomplete="off"></div>
        <div class="q"><label>Last name <span class="req">*</span></label>
          <input type="text" value="${esc(r.lastName||'')}" oninput="setRef(${i},'lastName',this.value)" autocomplete="off"></div>
      </div>
      <div class="q"><label>Relationship to you <span class="req">*</span></label>
        <select onchange="setRef(${i},'relationship',this.value)">
          <option value="">— pick one —</option>
          ${RELATIONSHIPS.map(([l,v])=>`<option value="${v}" ${r.relationship===v?'selected':''}>${l}</option>`).join('')}
        </select></div>
      <div class="q"><label>Phone number <span class="req">*</span><span class="hint">Best number to reach them</span></label>
        <input type="tel" value="${esc(r.phone||'')}" oninput="setRef(${i},'phone',this.value)" placeholder="(216) 000-0000" autocomplete="off"></div>
      <div class="q"><label>Email <span class="hint">Optional — gives us a backup if they don't pick up</span></label>
        <input type="email" value="${esc(r.email||'')}" oninput="setRef(${i},'email',this.value)" placeholder="optional" autocomplete="off"></div>
      <div class="grid2">
        <div class="q"><label>How long have you known them?</label>
          <select onchange="setRef(${i},'duration',this.value)">
            <option value="">—</option>
            ${DURATIONS.map(([l,v])=>`<option value="${v}" ${r.duration===v?'selected':''}>${l}</option>`).join('')}
          </select></div>
        <div class="q"><label>Best time to call</label>
          <select onchange="setRef(${i},'bestTime',this.value)">
            <option value="">—</option>
            <option ${r.bestTime==='morning'?'selected':''} value="morning">Mornings (9am–12pm)</option>
            <option ${r.bestTime==='afternoon'?'selected':''} value="afternoon">Afternoons (12pm–5pm)</option>
            <option ${r.bestTime==='evening'?'selected':''} value="evening">Evenings (5pm–8pm)</option>
            <option ${r.bestTime==='any'?'selected':''} value="any">Any time</option>
          </select></div>
      </div>
      <div class="q"><label>Anything they should know about why we're calling? <span class="hint">Optional — e.g., "I worked with their mother for 18 months"</span></label>
        <textarea oninput="setRef(${i},'notes',this.value)" placeholder="Optional context">${esc(r.notes||'')}</textarea></div>
    </div>`;
  }).join('');
  document.getElementById('add-btn').disabled=refs.length>=MAX_REFS;
}

function setRef(i,k,v){refs[i][k]=v;}
function addRef(){if(refs.length>=MAX_REFS)return;refs.push({});renderRefs();window.scrollBy({top:200,behavior:'smooth'});}
function removeRef(i){if(refs.length<=2)return;refs.splice(i,1);renderRefs();}
function esc(s){return String(s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}

function validate(){
  const ids=getCandidateIdentifiers();
  if(!ids.refCode&&!ids.email){alert('This link is missing a candidate identifier. Please use the link from the email Solura sent you.');return null;}
  const filled=refs.filter(r=>r.firstName&&r.lastName&&r.relationship&&r.phone).map(r=>({
    firstName:(r.firstName||'').trim(),
    lastName:(r.lastName||'').trim(),
    relationship:r.relationship,
    phone:(r.phone||'').trim(),
    email:(r.email||'').trim(),
    duration:r.duration||'',
    bestTime:r.bestTime||'',
    notes:(r.notes||'').trim()
  }));
  if(filled.length<2){alert('Please fill in at least 2 references (first name, last name, relationship, phone are required for each).');return null;}
  /* Send BOTH identifiers — worker tries refCode first (more reliable), falls back to email. */
  return {candidateRefCode:ids.refCode,candidateEmail:ids.email,refs:filled};
}

async function submitRefs(){
  const payload=validate();if(!payload)return;
  const btn=document.getElementById('submit-btn');btn.disabled=true;btn.textContent='Submitting…';
  try{
    const r=await fetch(WEBHOOK_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({kind:'REFERENCES_SUBMITTED',submission:payload})
    });
    /* 400 = validation error (often suspicious reference). Parse and show the worker's message. */
    if(r.status===400){
      let msg='One or more of your references could not be accepted.';
      try{const j=await r.json();if(j&&j.message)msg=j.message;}catch(e){}
      btn.disabled=false;btn.textContent='Submit references';
      alert(msg);return;
    }
    if(!r.ok){const t=await r.text().catch(()=>'');throw new Error('Server returned '+r.status+' '+t.slice(0,80));}
    document.getElementById('app').innerHTML=`<div class="done">
      <div class="ck">✓</div><h2>Thanks!</h2>
      <p>Your ${payload.refs.length} reference${payload.refs.length===1?'':'s'} ${payload.refs.length===1?'is':'are'} in. We'll call them in the next few business days.</p>
      <p style="margin-top:14px;font-size:13px">In the meantime, the interview is the next step — keep an eye on your email.</p>
    </div>`;
    window.scrollTo(0,0);
  }catch(err){
    btn.disabled=false;btn.textContent='Submit references';
    console.error('Submit error:',err);
    alert("Sorry, something went wrong sending your references. Please try again, or email careers@solurahomecare.com directly with the details.");
  }
}

/* on load: show banner if BOTH identifiers are missing, then render */
(function init(){
  const ids=getCandidateIdentifiers();
  if(!ids.refCode&&!ids.email){
    document.getElementById('app').innerHTML=`<div class="head"><div class="brand">Solura Home Care<small>References Form</small></div></div>
      <div class="err"><h2>Link is missing info</h2>
      <p>This link doesn't have your candidate identifier. Please use the link from the email Solura sent you, or email <a href="mailto:careers@solurahomecare.com" style="color:var(--sky-deep);font-weight:600">careers@solurahomecare.com</a> and we'll send you a fresh one.</p></div>`;
    return;
  }
  renderRefs();
})();
</script>
</body>
</html>
