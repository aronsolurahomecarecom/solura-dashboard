<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Solura Home Care - Lead Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#1a2744;--navy-light:#243358;--gold:#C8870A;--gold-light:#e09d20;--gold-pale:#fef3dc;--sky:#3A7DC9;--sky-light:#5B9BD5;--sky-pale:#e8f2fb;--green:#1a7a4a;--green-pale:#e6f5ee;--red:#c0392b;--red-pale:#fdeaea;--amber:#b8730a;--amber-pale:#fff4e0;--gray:#6b7280;--gray-light:#e5e7eb;--gray-pale:#f9fafb;--white:#fff;--radius:10px;--radius-lg:16px;--shadow:0 2px 12px rgba(26,39,68,.12);--shadow-lg:0 8px 32px rgba(26,39,68,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#f0f3f8;color:#1a2744;min-height:100vh}
h1,h2,h3{font-family:'Cormorant Garamond',serif}
#login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,var(--navy) 0%,var(--navy-light) 60%,#1e3d6e 100%)}
.login-card{background:var(--white);border-radius:var(--radius-lg);padding:48px 56px;text-align:center;box-shadow:var(--shadow-lg);max-width:420px;width:90%}
.login-logo{width:72px;height:72px;background:var(--navy);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;font-family:'Cormorant Garamond',serif;color:var(--gold);font-size:28px;font-weight:700}
.login-card h2{color:var(--navy);font-size:28px;margin-bottom:6px}
.login-card p{color:var(--gray);font-size:14px;margin-bottom:32px}
.btn-login{background:var(--sky);color:#fff;border:none;border-radius:8px;padding:14px 32px;font-size:15px;font-weight:600;cursor:pointer;width:100%}
.btn-login:hover{background:var(--sky-light)}
#app{display:none;flex-direction:column;min-height:100vh}
header{background:var(--navy);padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.hdr-brand{display:flex;align-items:center;gap:12px}
.hdr-logo{width:36px;height:36px;background:var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;color:var(--navy);font-size:14px;font-weight:700}
.hdr-title{color:var(--white);font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600}
.hdr-subtitle{color:rgba(255,255,255,.5);font-size:12px;margin-left:4px}
.hdr-right{display:flex;align-items:center;gap:8px}
.hdr-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.85);border-radius:6px;padding:6px 14px;font-size:13px;cursor:pointer}
.hdr-btn:hover{background:rgba(255,255,255,.18)}
#hdr-sync-btn{background:var(--gold);border-color:var(--gold);color:var(--navy);font-weight:600}
.tabs{background:var(--white);border-bottom:2px solid var(--gray-light);display:flex;padding:0 24px}
.tab{padding:14px 20px;font-size:14px;font-weight:500;color:var(--gray);border-bottom:3px solid transparent;cursor:pointer;transition:all .2s;margin-bottom:-2px}
.tab.active{color:var(--navy);border-bottom-color:var(--gold);font-weight:600}
.tab:hover:not(.active){color:var(--navy);background:var(--gray-pale)}
main{flex:1;padding:24px;max-width:1400px;width:100%;margin:0 auto}
.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat-card{background:var(--white);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px}
.stat-label{font-size:12px;color:var(--gray);font-weight:500;text-transform:uppercase;letter-spacing:.5px}
.stat-value{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:700;color:var(--navy);line-height:1}
.stat-sub{font-size:12px;color:var(--gray)}
.stat-card.gold{border-left:4px solid var(--gold)}.stat-card.sky{border-left:4px solid var(--sky)}.stat-card.green{border-left:4px solid var(--green)}.stat-card.red{border-left:4px solid var(--red)}
.filter-bar{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;align-items:center}
.filter-bar input,.filter-bar select{border:1.5px solid var(--gray-light);border-radius:8px;padding:8px 14px;font-size:13px;font-family:'Plus Jakarta Sans',sans-serif;color:var(--navy);background:var(--white);outline:none}
.filter-bar input:focus,.filter-bar select:focus{border-color:var(--sky)}
.filter-bar input{width:220px}
.filter-refresh{margin-left:auto;background:var(--sky);color:#fff;border:none;border-radius:8px;padding:8px 18px;font-size:13px;font-weight:600;cursor:pointer}
.leads-grid{display:flex;flex-direction:column;gap:12px}
.lead-card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;border-left:5px solid var(--gray-light);transition:box-shadow .2s}
.lead-card:hover{box-shadow:var(--shadow-lg)}
.status-active-conversation{border-left-color:var(--sky)}.status-client{border-left-color:var(--green)}.status-on-hold{border-left-color:var(--amber)}.status-waiting-on-family{border-left-color:#9b59b6}.status-new-lead{border-left-color:var(--gold)}.status-lost{border-left-color:var(--red)}
.lc-top{display:flex;align-items:center;padding:16px 20px;gap:14px;cursor:pointer}
.lc-avatar{width:44px;height:44px;border-radius:50%;background:var(--navy);display:flex;align-items:center;justify-content:center;color:var(--gold);font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:700;flex-shrink:0}
.lc-main{flex:1;min-width:0}
.lc-name{font-weight:600;font-size:16px;color:var(--navy)}
.lc-meta{font-size:12px;color:var(--gray);margin-top:2px}
.lc-badges{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px}
.badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;white-space:nowrap}
.s-active{background:var(--sky-pale);color:var(--sky)}.s-client{background:var(--green-pale);color:var(--green)}.s-hold{background:var(--amber-pale);color:var(--amber)}.s-waiting{background:#f3e8ff;color:#7c3aed}.s-new{background:var(--gold-pale);color:var(--gold)}.s-lost{background:var(--red-pale);color:var(--red)}
.badge-phase{background:var(--navy);color:var(--white)}.badge-overdue{background:var(--red-pale);color:var(--red)}.badge-today{background:var(--amber-pale);color:var(--amber)}
.lc-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0}
.lc-value{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:700;color:var(--navy);text-align:right}
.lc-value-label{font-size:11px;color:var(--gray)}
.lc-actions{display:flex;gap:8px}
.btn-action{border:none;border-radius:6px;padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s}
.btn-call{background:var(--sky);color:#fff}.btn-sms{background:var(--green);color:#fff}.btn-email{background:var(--navy);color:#fff}.btn-expand{background:var(--gray-pale);color:var(--gray);border:1.5px solid var(--gray-light)}
.lc-next-action{background:var(--gold-pale);border-top:1px solid #f0dbb0;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.na-text{font-size:13px;color:var(--amber);font-weight:600}
.btn-mark-done{background:var(--gold);color:var(--navy);border:none;border-radius:6px;padding:7px 16px;font-size:12px;font-weight:700;cursor:pointer}
.btn-mark-done:hover{background:var(--gold-light)}
.saving-spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--navy);border-top-color:transparent;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.save-ok{color:var(--green);font-size:13px;font-weight:600}.save-err{color:var(--red);font-size:12px}
.detail-panel{background:var(--gray-pale);border-top:1px solid var(--gray-light);padding:20px;display:none;grid-template-columns:1fr 1fr;gap:16px}
.detail-panel.open{display:grid}
.dp-section{background:var(--white);border-radius:8px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.dp-section h4{font-size:13px;font-weight:600;color:var(--navy);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--gray-light);text-transform:uppercase;letter-spacing:.5px}
.dp-row{display:flex;justify-content:space-between;padding:5px 0;font-size:13px;gap:8px}
.dp-label{color:var(--gray);font-weight:500;flex-shrink:0}.dp-value{color:var(--navy);font-weight:500;text-align:right;word-break:break-word}
.dp-full{grid-column:1/-1}
.dp-notes{background:var(--gray-pale);border-radius:6px;padding:12px;font-size:13px;line-height:1.6;margin-top:4px;min-height:60px;white-space:pre-wrap}
#action-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200}
#action-drawer{position:fixed;top:0;right:-440px;width:440px;height:100vh;background:var(--white);z-index:201;box-shadow:-8px 0 32px rgba(0,0,0,.2);transition:right .3s;display:flex;flex-direction:column}
#action-drawer.open{right:0}
.drawer-header{background:var(--navy);padding:20px 24px;display:flex;align-items:flex-start;justify-content:space-between;flex-shrink:0}
.drawer-header h3{color:var(--white);font-size:20px}
.drawer-header p{color:rgba(255,255,255,.6);font-size:13px;margin-top:2px}
.drawer-close{background:rgba(255,255,255,.1);border:none;color:var(--white);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.drawer-body{flex:1;overflow-y:auto;padding:24px}
.drawer-action-banner{background:var(--gold-pale);border:1.5px solid #f0dbb0;border-radius:8px;padding:14px 16px;margin-bottom:20px}
.dab-label{font-size:11px;font-weight:600;color:var(--amber);text-transform:uppercase;letter-spacing:.5px}
.dab-text{font-size:15px;font-weight:600;color:var(--navy);margin-top:4px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:12px;font-weight:600;color:var(--navy);margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}
.form-group select,.form-group input,.form-group textarea{width:100%;border:1.5px solid var(--gray-light);border-radius:8px;padding:10px 14px;font-size:14px;font-family:'Plus Jakarta Sans',sans-serif;color:var(--navy);background:var(--white);outline:none}
.form-group select:focus,.form-group input:focus,.form-group textarea:focus{border-color:var(--sky)}
.form-group textarea{resize:vertical;min-height:80px;line-height:1.5}
.drawer-footer{padding:20px 24px;border-top:1px solid var(--gray-light);display:flex;gap:10px;flex-shrink:0}
.btn-save{flex:1;background:var(--gold);color:var(--navy);border:none;border-radius:8px;padding:13px;font-size:15px;font-weight:700;cursor:pointer}
.btn-save:hover{background:var(--gold-light)}.btn-save:disabled{opacity:.6;cursor:not-allowed}
.btn-cancel{background:var(--gray-pale);color:var(--gray);border:1.5px solid var(--gray-light);border-radius:8px;padding:13px 20px;font-size:14px;font-weight:600;cursor:pointer}
.drawer-status{padding:0 24px 12px;text-align:center;font-size:13px;min-height:24px}
#script-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:300;align-items:center;justify-content:center}
#script-overlay.open{display:flex}
.script-modal{background:var(--white);border-radius:var(--radius-lg);width:90%;max-width:540px;max-height:85vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
.script-modal-header{background:var(--navy);padding:20px 24px;border-radius:var(--radius-lg) var(--radius-lg) 0 0;display:flex;align-items:flex-start;justify-content:space-between}
.script-modal-header h3{color:var(--white);font-size:18px}
.script-modal-header p{color:rgba(255,255,255,.6);font-size:12px;margin-top:3px}
.script-close{background:none;border:none;color:rgba(255,255,255,.7);font-size:22px;cursor:pointer;flex-shrink:0}
.script-body{padding:24px;overflow-y:auto;flex:1}
.script-section h4{font-size:13px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.script-bubble{background:var(--gray-pale);border-left:3px solid var(--gold);border-radius:0 8px 8px 0;padding:14px 16px;font-size:14px;line-height:1.75;font-style:italic}
.script-action-row{display:flex;gap:10px;padding-top:16px}
.btn-script-action{flex:1;border:none;border-radius:8px;padding:12px;font-size:14px;font-weight:600;cursor:pointer}
.btn-sms-send{background:var(--green);color:#fff}.btn-call-now{background:var(--navy);color:#fff}.btn-log-contact{background:var(--gold);color:var(--navy)}
.empty-state{text-align:center;padding:60px 20px;color:var(--gray)}
.empty-state h3{font-size:22px;color:var(--navy);margin-bottom:8px}
.loading-overlay{display:none;position:fixed;inset:0;background:rgba(255,255,255,.85);z-index:500;align-items:center;justify-content:center;flex-direction:column;gap:16px}
.loading-overlay.show{display:flex}
.loading-spinner{width:40px;height:40px;border:3px solid var(--gray-light);border-top-color:var(--sky);border-radius:50%;animation:spin .7s linear infinite}
.loading-text{color:var(--navy);font-weight:600}
@media(max-width:700px){.stats-bar{grid-template-columns:1fr 1fr}.detail-panel.open{grid-template-columns:1fr}#action-drawer{width:100%;right:-100%}.lc-right{display:none}main{padding:12px}}
</style>
</head>
<body>
<div id="login-screen" style="display:flex">
  <div class="login-card">
    <div class="login-logo">S</div>
    <h2>Solura Home Care</h2>
    <p>Lead tracking &amp; follow-up dashboard</p>
    <button class="btn-login" onclick="startLogin()">Sign in with Microsoft</button>
  </div>
</div>
<div id="app">
  <header>
    <div class="hdr-brand">
      <div class="hdr-logo">S</div>
      <div><span class="hdr-title">Solura</span><span class="hdr-subtitle">Home Care</span></div>
    </div>
    <div class="hdr-right">
      <span id="hdr-user" style="color:rgba(255,255,255,.55);font-size:12px;margin-right:4px"></span>
      <button class="hdr-btn" id="hdr-sync-btn" onclick="syncNow()">&#8635; Sync</button>
      <button class="hdr-btn" onclick="logout()">Sign out</button>
    </div>
  </header>
  <div class="tabs">
    <div class="tab active" onclick="switchTab('today')" id="tab-today">Today's Queue</div>
    <div class="tab" onclick="switchTab('all')" id="tab-all">All Leads</div>
    <div class="tab" onclick="switchTab('active')" id="tab-active">Active</div>
    <div class="tab" onclick="switchTab('pipeline')" id="tab-pipeline">Pipeline</div>
  </div>
  <main>
    <div class="stats-bar" id="stats-bar"></div>
    <div class="filter-bar">
      <input type="text" id="search-box" placeholder="Search leads..." oninput="renderLeads()">
      <select id="status-filter" onchange="renderLeads()">
        <option value="">All Statuses</option>
        <option>New Lead</option><option>Active Conversation</option>
        <option>Waiting on Family</option><option>On Hold</option>
        <option>Client</option><option>Lost</option>
      </select>
      <select id="source-filter" onchange="renderLeads()"><option value="">All Sources</option></select>
      <button class="filter-refresh" onclick="syncNow()">Refresh</button>
    </div>
    <div class="leads-grid" id="leads-grid"></div>
  </main>
</div>
<div id="action-overlay" onclick="closeDrawer()"></div>
<div id="action-drawer">
  <div class="drawer-header">
    <div style="flex:1;min-width:0"><h3 id="drawer-name">Lead</h3><p id="drawer-subtitle"></p></div>
    <button class="drawer-close" onclick="closeDrawer()">&#10005;</button>
  </div>
  <div class="drawer-body">
    <div class="drawer-action-banner" id="drawer-banner" style="display:none">
      <div class="dab-label">Next Sequence Action</div>
      <div class="dab-text" id="drawer-banner-text"></div>
    </div>
    <div class="form-group"><label>Contact Method</label>
      <select id="ep-method"><option>Phone call</option><option>Text message</option><option>Email</option><option>In-person</option></select>
    </div>
    <div class="form-group"><label>Notes / Outcome</label>
      <textarea id="ep-notes" placeholder="Left voicemail, spoke 10 min, etc."></textarea>
    </div>
    <div class="form-group"><label>Status</label>
      <select id="ep-status"><option>New Lead</option><option>Active Conversation</option><option>Waiting on Family</option><option>On Hold</option><option>Client</option><option>Lost</option></select>
    </div>
    <div class="form-group"><label>Next Follow-Up Date</label><input type="date" id="ep-nextfu"></div>
  </div>
  <div class="drawer-status" id="drawer-status"></div>
  <div class="drawer-footer">
    <button class="btn-cancel" onclick="closeDrawer()">Cancel</button>
    <button class="btn-save" id="btn-save-drawer" onclick="saveDrawer()">Save &amp; Mark Done</button>
  </div>
</div>
<div id="script-overlay" onclick="scriptOverlayClick(event)">
  <div class="script-modal">
    <div class="script-modal-header">
      <div style="flex:1;min-width:0"><h3 id="script-title">Script</h3><p id="script-subtitle"></p></div>
      <button class="script-close" onclick="closeScript()">&#10005;</button>
    </div>
    <div class="script-body" id="script-body"></div>
  </div>
</div>
<div class="loading-overlay" id="loading-overlay">
  <div class="loading-spinner"></div>
  <div class="loading-text" id="loading-text">Loading leads...</div>
</div>
<script>
var CLIENT_ID='1cb530f8-6c5f-4605-9590-068dd55e0b81';
var REDIRECT='https://aronsolurahomecarecom.github.io/solura-dashboard/Solura_Dashboard.html';
var SCOPES='openid profile Files.ReadWrite.All Sites.ReadWrite.All offline_access';
var AUTH_BASE='https://login.microsoftonline.com/common/v2.0';
var GRAPH='https://graph.microsoft.com/v1.0';
var FILE_PATH='Documents/Solura_Lead_Tracker.xlsx';
var SHEET_NAME='Lead Tracker';
var DATA_ROW=4;
var HCG_LOC='kWlzzI2WZaes2GnQf7DV';
var HCG_KEY='pit-5df912ec-7542-4dc8-af5b-272472ba84e9';
var OUR_PHONE='2164838981';
var ACTIVE=['Active Conversation','Client','On Hold','Waiting on Family'];
var C={NUM:0,ADDED:1,NAME:2,PHONE:3,EMAIL:4,CITY:5,SOURCE:6,SERVICES:7,HRS:8,ESTSTART:9,STATUS:10,LASTCONTACT:11,METHOD:12,NEXTFU:13,DM:14,PAY:15,VALUE:16,AGREEMENT:17,NOTES:18,SEQPHASE:19,SEQACTION:20,SEQDATE:21,SAFETY:22,RELATIONSHIP:23,NEXTSUG:24};
var leads=[],fileId=null,currentTab='today',drawerLeadId=null;
function pad(n){return n<10?'0'+n:String(n)}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function localMid(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function parseDate(v){
  if(!v||v===''||v==='N/A')return null;
  if(typeof v==='number'&&v>1000)return localMid(new Date((v-25569)*86400000));
  if(typeof v==='string'){var m;
    if((m=v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/)))return new Date(+m[3],+m[1]-1,+m[2]);
    if((m=v.match(/^(\d{4})-(\d{2})-(\d{2})$/)))return new Date(+m[1],+m[2]-1,+m[3]);}
  return null}
function fmtDate(v){var d=parseDate(v);return d?(d.getMonth()+1)+'/'+d.getDate()+'/'+d.getFullYear():'--'}
function fmtMoney(v){if(!v||v==='')return '--';var n=parseFloat(v);return isNaN(n)?String(v):'$'+n.toLocaleString()}
function initials(n){if(!n)return '?';var p=n.trim().split(' ');return p.length>=2?(p[0][0]+p[p.length-1][0]).toUpperCase():n[0].toUpperCase()}
function sBadge(s){return{'Active Conversation':'s-active','Client':'s-client','On Hold':'s-hold','Waiting on Family':'s-waiting','New Lead':'s-new','Lost':'s-lost'}[s]||''}
function sCard(s){return{'Active Conversation':'status-active-conversation','Client':'status-client','On Hold':'status-on-hold','Waiting on Family':'status-waiting-on-family','New Lead':'status-new-lead','Lost':'status-lost'}[s]||''}
function colLetter(i){var r='';i++;while(i>0){r=String.fromCharCode(65+(i-1)%26)+r;i=Math.floor((i-1)/26)}return r}
function gc(row,col){var v=row&&col<row.length?row[col]:null;return(v===null||v===undefined)?'':v}
function getLead(id){for(var i=0;i<leads.length;i++)if(leads[i].id===id)return leads[i];return null}
function mkLead(row,idx){return{id:'lead-'+idx,dataIdx:idx,num:gc(row,C.NUM),dateAdded:gc(row,C.ADDED),name:gc(row,C.NAME),phone:gc(row,C.PHONE),email:gc(row,C.EMAIL),city:gc(row,C.CITY),source:gc(row,C.SOURCE),services:gc(row,C.SERVICES),hrs:gc(row,C.HRS),estStart:gc(row,C.ESTSTART),status:gc(row,C.STATUS)||'New Lead',lastContact:gc(row,C.LASTCONTACT),method:gc(row,C.METHOD),nextFU:gc(row,C.NEXTFU),dm:gc(row,C.DM),pay:gc(row,C.PAY),value:gc(row,C.VALUE),agreement:gc(row,C.AGREEMENT),notes:gc(row,C.NOTES),seqPhase:gc(row,C.SEQPHASE),seqAction:gc(row,C.SEQACTION),seqDate:gc(row,C.SEQDATE),safety:gc(row,C.SAFETY),relationship:gc(row,C.RELATIONSHIP),nextSug:gc(row,C.NEXTSUG)}}
function hasSlot(log,slot){return(log||'').indexOf(slot+':')!==-1}
function appendSlot(log,slot){var e=slot+':'+todayStr();return log?log+'|'+e:e}
function nextAction(lead){
  if(ACTIVE.indexOf(lead.status)!==-1||lead.status==='Lost')return null;
  var added=parseDate(lead.dateAdded);if(!added)return null;
  var td=today(),day=Math.floor((td-added)/86400000)+1,log=(lead.seqAction||'').trim();
  if(day<1)day=1;
  if(day===1){
    if(!hasSlot(log,'P1-TEXT'))return{phase:1,slot:'P1-TEXT',type:'sms',icon:'💬',text:'Send Intro Text - Day 1',label:'Send Text'};
    if(!hasSlot(log,'P1-CALL1'))return{phase:1,slot:'P1-CALL1',type:'call',icon:'📞',text:'First Call (5 min after text)',label:'Call Now'};
    if(!hasSlot(log,'P1-CALL2'))return{phase:1,slot:'P1-CALL2',type:'call',icon:'📞',text:'Second Call - Day 1',label:'Call Now'};
    if(!hasSlot(log,'P1-MISS'))return{phase:1,slot:'P1-MISS',type:'sms',icon:'💬',text:'Send Missed You Text',label:'Send Text'};
    return null}
  if(day>=2&&day<=10){
    var aKey='AM-'+day+':'+todayStr(),pKey='PM-'+day+':'+todayStr();
    if(log.indexOf(aKey)===-1)return{phase:2,day:day,slot:'AM-'+day,type:'call',icon:'📞',text:'AM Call - Day '+day,label:'Call Now'};
    if(log.indexOf(pKey)===-1){var isTxt=day%2===0;return{phase:2,day:day,slot:'PM-'+day,type:isTxt?'sms':'call',icon:isTxt?'💬':'📞',text:isTxt?'PM Text - Day '+day:'PM Call - Day '+day,label:isTxt?'Send Text':'Call Now'}}
    return null}
  if(day>=11&&day<=41){var wk=Math.floor((day-11)/7)+2,ws='WK-'+wk;if(!hasSlot(log,ws))return{phase:3,week:wk,slot:ws,type:'sms',icon:'💬',text:'Week '+wk+' Nurture Text',label:'Send Text'};return null}
  if(day===42){if(!hasSlot(log,'P4-CALL'))return{phase:4,slot:'P4-CALL',type:'call',icon:'📞',text:'6-Week Re-engagement Call',label:'Call Now'};return null}
  if(day>42){var pw=Math.floor((day-42)/7)+1,ps='P5-W'+pw;if(!hasSlot(log,ps))return{phase:5,week:pw,slot:ps,type:'sms',icon:'💬',text:'Long-term Nurture (Week '+pw+')',label:'Send Text'};return null}
  return null}
function nextFUDate(a){var d=today();if(!a||a.phase<=2)d.setDate(d.getDate()+1);else d.setDate(d.getDate()+7);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function dueLabel(l){var fu=parseDate(l.nextFU);if(!fu)return null;var diff=Math.round((fu-today())/86400000);if(diff<0)return{text:'Overdue '+Math.abs(diff)+'d',cls:'badge-overdue'};if(diff===0)return{text:'Due Today',cls:'badge-today'};return null}
function randB64(n){var a=new Uint8Array(n);crypto.getRandomValues(a);return btoa(String.fromCharCode.apply(null,a)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'')}
async function sha256B64(s){var h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return btoa(String.fromCharCode.apply(null,new Uint8Array(h))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'')}
function startLogin(){var v=randB64(43);sessionStorage.setItem('pkce_v',v);sha256B64(v).then(function(ch){var st=randB64(16);sessionStorage.setItem('pkce_s',st);window.location.href=AUTH_BASE+'/authorize?client_id='+CLIENT_ID+'&response_type=code&redirect_uri='+encodeURIComponent(REDIRECT)+'&scope='+encodeURIComponent(SCOPES)+'&code_challenge='+ch+'&code_challenge_method=S256&state='+st+'&prompt=select_account'})}
async function exchangeCode(code){try{var v=sessionStorage.getItem('pkce_v');if(!v)return false;var b=new URLSearchParams({client_id:CLIENT_ID,grant_type:'authorization_code',code:code,redirect_uri:REDIRECT,code_verifier:v});var r=await fetch(AUTH_BASE+'/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:b.toString()});var d=await r.json();if(!d.access_token)return false;setTok(d.access_token,d.expires_in||3600);if(d.refresh_token)localStorage.setItem('sl_rt',d.refresh_token);sessionStorage.removeItem('pkce_v');return true}catch(e){return false}}
async function refreshTok(){var rt=localStorage.getItem('sl_rt');if(!rt)return false;try{var b=new URLSearchParams({client_id:CLIENT_ID,grant_type:'refresh_token',refresh_token:rt,scope:SCOPES});var r=await fetch(AUTH_BASE+'/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:b.toString()});var d=await r.json();if(!d.access_token)return false;setTok(d.access_token,d.expires_in||3600);if(d.refresh_token)localStorage.setItem('sl_rt',d.refresh_token);return true}catch(e){return false}}
function setTok(t,e){localStorage.setItem('sl_tok',t);localStorage.setItem('sl_exp',Date.now()+e*1000)}
function getTok(){return localStorage.getItem('sl_tok')}
function tokValid(){return Date.now()<parseInt(localStorage.getItem('sl_exp')||'0')-30000}
async function ensureTok(){if(tokValid())return true;return await refreshTok()}
function logout(){['sl_tok','sl_exp','sl_rt'].forEach(function(k){localStorage.removeItem(k)});document.getElementById('app').style.display='none';document.getElementById('login-screen').style.display='flex'}
async function gGet(path){await ensureTok();var r=await fetch(GRAPH+path,{headers:{Authorization:'Bearer '+getTok()}});if(!r.ok)throw new Error('Graph '+path+' -> '+r.status);return r.json()}
async function gPatch(path,body){await ensureTok();var r=await fetch(GRAPH+path,{method:'PATCH',headers:{Authorization:'Bearer '+getTok(),'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok){var t=await r.text();throw new Error('PATCH '+r.status+': '+t.substring(0,200))}return r.status===204?null:r.json()}
async function getFileId(){if(fileId)return fileId;var pts=FILE_PATH.split('/'),name=pts.pop(),folder=pts.join('/');var path=folder?'/me/drive/root:/'+folder+':/children':'/me/drive/root/children';var data=await gGet(path);for(var i=0;i<data.value.length;i++){if(data.value[i].name===name){fileId=data.value[i].id;return fileId}}var s=await gGet('/me/drive/root/search(q=\''+encodeURIComponent(name)+'\')');for(var j=0;j<(s.value||[]).length;j++){if(s.value[j].name===name){fileId=s.value[j].id;return fileId}}throw new Error('File not found: '+FILE_PATH)}
async function getMe(){try{var d=await gGet('/me');document.getElementById('hdr-user').textContent=d.displayName||d.userPrincipalName||''}catch(e){}}
async function loadLeads(){showLoad('Loading leads from OneDrive...');try{var fid=await getFileId();var data=await gGet('/me/drive/items/'+fid+'/workbook/worksheets/'+encodeURIComponent(SHEET_NAME)+'/usedRange');var rows=data.values;if(!rows||rows.length<DATA_ROW){leads=[];renderLeads();return}leads=[];for(var i=DATA_ROW-1;i<rows.length;i++){var row=rows[i];if(!row||!row[C.NAME]||String(row[C.NAME]).trim()==='')continue;leads.push(mkLead(row,i-(DATA_ROW-1)))}buildSrcFilter();buildStats();renderLeads()}catch(e){alert('Could not load leads:\n'+e.message)}finally{hideLoad()}}
async function writeCells(idx,updates){var fid=await getFileId();var er=idx+DATA_ROW;for(var i=0;i<updates.length;i++){var cl=colLetter(updates[i].col),addr=cl+er;await gPatch('/me/drive/items/'+fid+'/workbook/worksheets/'+encodeURIComponent(SHEET_NAME)+'/range(address=\''+addr+'\')',{values:[[updates[i].value]]})}}
async function sendSMS(phone,msg){var c=String(phone).replace(/\D/g,'');if(c.length===10)c='1'+c;var r=await fetch('https://rest.gohighlevel.com/v1/conversations/messages',{method:'POST',headers:{Authorization:'Bearer '+HCG_KEY,'Content-Type':'application/json'},body:JSON.stringify({type:'SMS',locationId:HCG_LOC,fromNumber:'+1'+OUR_PHONE,toNumber:'+'+c,message:msg})});if(!r.ok)throw new Error('SMS '+r.status)}
function firstName(n){return(n||'there').split(' ')[0]}
function getScript(a,l){if(!a)return null;var fn=firstName(l.name),ct=l.city||'your area';
  if(a.slot==='P1-TEXT')return'Hi '+fn+', this is Aron from Solura Home Care. I\'d love to connect about care options for your family - we specialize in compassionate in-home support in '+ct+'. Would love to chat when you have a moment!';
  if(a.slot==='P1-MISS')return'Hi '+fn+', I tried calling just now - I\'m Aron from Solura Home Care. Feel free to call or text back anytime: 216-483-8981.';
  if(a.slot==='P4-CALL')return'Hi '+fn+', this is Aron from Solura Home Care. It\'s been about 6 weeks since we connected - wanted to personally check in. Do you have 5 minutes?';
  if(a.slot&&a.slot.indexOf('WK-')===0)return'Hi '+fn+', Aron from Solura Home Care checking in. We\'re still here whenever you\'re ready - happy to answer any questions. Hope all is well!';
  if(a.slot&&a.slot.indexOf('P5-')===0)return'Hi '+fn+', Aron from Solura Home Care. Just a friendly check-in - we\'re always here when the timing is right. Wishing you all the best!';
  if(a.type==='call')return'Hi, may I speak with '+l.name+'? ... Hi '+fn+', this is Aron with Solura Home Care. I\'m calling about in-home care - do you have a few minutes?';
  return null}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function buildSrcFilter(){var sel=document.getElementById('source-filter'),src={};leads.forEach(function(l){if(l.source)src[l.source]=1});while(sel.options.length>1)sel.remove(1);Object.keys(src).sort().forEach(function(s){var o=document.createElement('option');o.value=s;o.textContent=s;sel.appendChild(o)})}
function buildStats(){var tot=leads.length,act=leads.filter(function(l){return ACTIVE.indexOf(l.status)!==-1}).length,tq=leads.filter(function(l){return nextAction(l)!==null}).length,val=leads.reduce(function(s,l){return s+(parseFloat(l.value)||0)},0);document.getElementById('stats-bar').innerHTML=sc('Total Leads','gold',tot,'')+sc("Today's Queue",'sky',tq,'need follow-up')+sc('Active','green',act,'in conversation')+sc('Pipeline Value','red','$'+Math.round(val/1000)+'K','est monthly')}
function sc(lbl,cls,val,sub){return'<div class="stat-card '+cls+'"><div class="stat-label">'+lbl+'</div><div class="stat-value">'+val+'</div>'+(sub?'<div class="stat-sub">'+sub+'</div>':'')+'</div>'}
function getFiltered(){var q=(document.getElementById('search-box').value||'').toLowerCase(),sf=document.getElementById('status-filter').value,src=document.getElementById('source-filter').value;return leads.filter(function(l){if(q&&l.name.toLowerCase().indexOf(q)===-1&&(l.phone||'').indexOf(q)===-1&&(l.city||'').toLowerCase().indexOf(q)===-1)return false;if(sf&&l.status!==sf)return false;if(src&&l.source!==src)return false;if(currentTab==='today')return nextAction(l)!==null;if(currentTab==='active')return ACTIVE.indexOf(l.status)!==-1;if(currentTab==='pipeline')return l.status!=='Lost'&&l.status!=='Client';return true})}
function renderLeads(){var f=getFiltered(),g=document.getElementById('leads-grid');if(f.length===0){var msg=currentTab==='today'?"You're all caught up!":'No leads match your filters.';g.innerHTML='<div class="empty-state"><h3>'+msg+'</h3><p>Switch tabs or adjust filters.</p></div>';return}g.innerHTML=f.map(renderCard).join('')}
function renderCard(l){var na=nextAction(l),due=dueLabel(l),pid='panel-'+l.id;
  var badges='<span class="badge '+sBadge(l.status)+'">'+esc(l.status)+'</span>';
  if(l.city)badges+='<span class="badge" style="background:#f0f3f8;color:#6b7280">'+esc(l.city)+'</span>';
  if(na)badges+='<span class="badge badge-phase">Phase '+na.phase+'</span>';
  if(due)badges+='<span class="badge '+due.cls+'">'+due.text+'</span>';
  var acts='';
  if(l.phone)acts+='<button class="btn-action btn-call" onclick="event.stopPropagation();callLead(\''+l.id+'\')">&#128222; Call</button>';
  if(l.phone)acts+='<button class="btn-action btn-sms" onclick="event.stopPropagation();smsPrompt(\''+l.id+'\')">&#128172; Text</button>';
  if(l.email)acts+='<button class="btn-action btn-email" onclick="event.stopPropagation();emailLead(\''+l.id+'\')">&#9993; Email</button>';
  acts+='<button class="btn-action btn-expand" onclick="event.stopPropagation();togglePanel(\''+pid+'\')">Details</button>';
  var naBar='';
  if(na)naBar='<div class="lc-next-action"><div class="na-text">'+na.icon+' '+esc(na.text)+'</div><div style="display:flex;gap:8px;align-items:center"><button class="btn-action btn-expand" style="font-size:11px" onclick="event.stopPropagation();showScript(\''+l.id+'\')">&#128203; Script</button><button class="btn-mark-done" onclick="event.stopPropagation();openDrawer(\''+l.id+'\')">'+na.label+' &#8594;</button></div></div>';
  return'<div class="lead-card '+sCard(l.status)+'" id="card-'+l.id+'">'
    +'<div class="lc-top" onclick="togglePanel(\''+pid+'\')">'
      +'<div class="lc-avatar">'+initials(l.name)+'</div>'
      +'<div class="lc-main"><div class="lc-name">'+esc(l.name)+'</div><div class="lc-meta">'+esc(l.phone||'--')+' &middot; '+esc(l.source||'--')+'</div><div class="lc-badges">'+badges+'</div></div>'
      +'<div class="lc-right"><div class="lc-value">'+fmtMoney(l.value)+'<div class="lc-value-label">est/mo</div></div><div class="lc-actions">'+acts+'</div></div>'
    +'</div>'+naBar+renderDetail(l,pid)+'</div>'}
function renderDetail(l,pid){
  return'<div class="detail-panel" id="'+pid+'">'
    +'<div class="dp-section"><h4>Contact</h4>'+dr('Phone',esc(l.phone||'--'))+dr('Email',esc(l.email||'--'))+dr('City',esc(l.city||'--'))+dr('Added',fmtDate(l.dateAdded))+dr('Decision Maker',esc(l.dm||'--'))+dr('Relationship',esc(l.relationship||'--'))+'</div>'
    +'<div class="dp-section"><h4>Care Details</h4>'+dr('Services',esc(l.services||'--'))+dr('Hrs/Week',l.hrs?l.hrs+' hrs':'--')+dr('Est Start',fmtDate(l.estStart))+dr('Payment',esc(l.pay||'--'))+dr('Value/mo',fmtMoney(l.value))+dr('Agreement',esc(l.agreement||'--'))+'</div>'
    +'<div class="dp-section"><h4>Follow-Up</h4>'+dr('Last Contact',fmtDate(l.lastContact))+dr('Method',esc(l.method||'--'))+dr('Next FU',fmtDate(l.nextFU))+dr('Suggested',esc(l.nextSug||'--'))+dr('Safety',esc(l.safety||'None'))+'</div>'
    +'<div class="dp-section"><h4>Sequence</h4>'+dr('Phase',esc(String(l.seqPhase||'--')))+'<div class="dp-row"><span class="dp-label">Log</span><span class="dp-value" style="font-size:11px;word-break:break-all">'+esc(String(l.seqAction||'--'))+'</span></div></div>'
    +'<div class="dp-section dp-full"><h4>Notes</h4><div class="dp-notes">'+esc(l.notes||'No notes yet.')+'</div></div>'
  +'</div>'}
function dr(lbl,val){return'<div class="dp-row"><span class="dp-label">'+lbl+'</span><span class="dp-value">'+val+'</span></div>'}
function togglePanel(id){var p=document.getElementById(id);if(p)p.classList.toggle('open')}
function callLead(id){var l=getLead(id);if(l&&l.phone)window.location.href='tel:'+l.phone.replace(/\D/g,'')}
function emailLead(id){var l=getLead(id);if(l&&l.email)window.location.href='mailto:'+l.email}
async function smsPrompt(id){var l=getLead(id);if(!l||!l.phone)return;var msg=prompt('Text to '+l.name+':','');if(!msg)return;try{await sendSMS(l.phone,msg);alert('Sent!')}catch(e){alert('SMS error: '+e.message)}}
function openDrawer(id){var l=getLead(id);if(!l)return;drawerLeadId=id;var na=nextAction(l);
  document.getElementById('drawer-name').textContent=l.name;
  document.getElementById('drawer-subtitle').textContent=l.status+(l.source?' - '+l.source:'');
  var ban=document.getElementById('drawer-banner');
  if(na){ban.style.display='block';document.getElementById('drawer-banner-text').textContent=na.icon+' '+na.text}else{ban.style.display='none'}
  var ms=document.getElementById('ep-method'),pref=l.nextSug||l.method||'Phone call';
  for(var i=0;i<ms.options.length;i++){if(ms.options[i].text===pref){ms.selectedIndex=i;break}}
  var ss=document.getElementById('ep-status');
  for(var j=0;j<ss.options.length;j++){if(ss.options[j].text===l.status){ss.selectedIndex=j;break}}
  var fi=document.getElementById('ep-nextfu'),fud=parseDate(l.nextFU);
  document.getElementById('ep-nextfu').value=na?nextFUDate(na):(fud?fud.getFullYear()+'-'+pad(fud.getMonth()+1)+'-'+pad(fud.getDate()):todayStr());
  document.getElementById('ep-notes').value='';
  document.getElementById('drawer-status').innerHTML='';
  document.getElementById('btn-save-drawer').disabled=false;
  document.getElementById('btn-save-drawer').textContent=na?'Save - Mark Done':'Save Contact';
  document.getElementById('action-overlay').style.display='block';
  document.getElementById('action-drawer').classList.add('open')}
function closeDrawer(){document.getElementById('action-overlay').style.display='none';document.getElementById('action-drawer').classList.remove('open');drawerLeadId=null}
async function saveDrawer(){
  var l=getLead(drawerLeadId);if(!l)return;
  var na=nextAction(l),method=document.getElementById('ep-method').value,notes=document.getElementById('ep-notes').value.trim(),status=document.getElementById('ep-status').value,nextFU=document.getElementById('ep-nextfu').value,btn=document.getElementById('btn-save-drawer'),stDiv=document.getElementById('drawer-status');
  btn.disabled=true;btn.innerHTML='<span class="saving-spinner"></span> Saving...';stDiv.innerHTML='';
  try{
    var newLog=na?appendSlot(l.seqAction||'',na.slot):(l.seqAction||'');
    var notesApp=notes?(l.notes?l.notes+'\n'+todayStr()+': '+notes:todayStr()+': '+notes):(l.notes||'');
    var updates=[{col:C.STATUS,value:status},{col:C.LASTCONTACT,value:todayStr()},{col:C.METHOD,value:method},{col:C.NEXTFU,value:nextFU||todayStr()},{col:C.NOTES,value:notesApp},{col:C.SEQACTION,value:newLog}];
    await writeCells(l.dataIdx,updates);
    l.status=status;l.lastContact=todayStr();l.method=method;l.nextFU=nextFU||todayStr();l.notes=notesApp;l.seqAction=newLog;
    stDiv.innerHTML='<span class="save-ok">&#10003; Saved to OneDrive!</span>';
    setTimeout(function(){closeDrawer();buildStats();renderLeads()},900);
  }catch(err){stDiv.innerHTML='<span class="save-err">Save failed: '+esc(err.message)+'</span>'}
  finally{btn.disabled=false;btn.textContent=na?'Save - Mark Done':'Save Contact'}}
function showScript(id){var l=getLead(id);if(!l)return;var na=nextAction(l),script=getScript(na,l),isSMS=na&&na.type==='sms';
  document.getElementById('script-title').textContent=na?na.text:'Script';
  document.getElementById('script-subtitle').textContent=l.name+(l.phone?' - '+l.phone:'');
  var row='';
  if(isSMS&&l.phone)row+='<button class="btn-script-action btn-sms-send" onclick="sendScriptedSMS(\''+id+'\')">&#128172; Send This Text</button>';
  else if(!isSMS)row+='<button class="btn-script-action btn-call-now" onclick="callLead(\''+id+'\');closeScript()">&#128222; Call Now</button>';
  row+='<button class="btn-script-action btn-log-contact" onclick="openDrawer(\''+id+'\');closeScript()">Log Contact &#8594;</button>';
  document.getElementById('script-body').innerHTML='<div class="script-section"><h4>'+(isSMS?'Text Message':'Call Script')+'</h4><div class="script-bubble">'+esc(script||'Standard greeting.')+'</div></div><div class="script-action-row">'+row+'</div>';
  document.getElementById('script-overlay').classList.add('open')}
async function sendScriptedSMS(id){var l=getLead(id);if(!l||!l.phone)return;var na=nextAction(l),msg=getScript(na,l);if(!msg)return;try{await sendSMS(l.phone,msg);closeScript();openDrawer(id)}catch(e){alert('SMS failed: '+e.message)}}
function scriptOverlayClick(e){if(e.target===document.getElementById('script-overlay'))closeScript()}
function closeScript(){document.getElementById('script-overlay').classList.remove('open')}
function switchTab(tab){currentTab=tab;['today','all','active','pipeline'].forEach(function(t){document.getElementById('tab-'+t).classList.toggle('active',t===tab)});renderLeads()}
async function syncNow(){fileId=null;await loadLeads()}
function showLoad(msg){document.getElementById('loading-text').textContent=msg||'Loading...';document.getElementById('loading-overlay').classList.add('show')}
function hideLoad(){document.getElementById('loading-overlay').classList.remove('show')}
function showApp(){document.getElementById('login-screen').style.display='none';document.getElementById('app').style.display='flex';getMe();loadLeads()}
(function init(){var p=new URLSearchParams(window.location.search),code=p.get('code');if(code){history.replaceState({},'',window.location.pathname);exchangeCode(code).then(function(ok){if(ok)showApp();else document.getElementById('login-screen').style.display='flex'});return}if(getTok()&&tokValid()){showApp();return}document.getElementById('login-screen').style.display='flex'})();
</script>
</body>
</html>
